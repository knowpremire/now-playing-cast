<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now Playing</title>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  /* Now Playing Car - Chromecast screen. The phone sends the song, art and lyrics; this page only draws them. */
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: "Google Sans", Roboto, "Helvetica Neue", Arial, sans-serif; cursor: none; }
  #bg { position: fixed; top: 0; right: 0; bottom: 0; left: 0; transition: background 1.2s ease; }
  #bg::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    background: radial-gradient(120% 90% at 20% 30%, rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 70%, rgba(0,0,0,.8) 100%); }
  #stage { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: grid; grid-template-columns: 30vw 1fr; gap: 5.5vw;
    padding: 11vh 8vw; box-sizing: border-box; } /* TVs crop the edges: keep everything well inside */
  #left { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  #art { width: 100%; height: 0; padding-top: 100%; border-radius: 1.6vw; background: #222 center/cover no-repeat;
    box-shadow: 0 2.5vh 6vh rgba(0,0,0,.5); transition: opacity .6s ease; }
  #title { margin-top: 3.5vh; font-size: 2.6vw; font-weight: 700; line-height: 1.15;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #artist { margin-top: .6vh; font-size: 1.7vw; color: rgba(255,255,255,.72);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar { margin-top: 2.6vh; height: .6vh; border-radius: 1vh; background: rgba(255,255,255,.22); overflow: hidden; }
  #fill { height: 100%; width: 0; background: #fff; border-radius: 1vh; }
  #times { display: flex; justify-content: space-between; margin-top: 1vh; font-size: 1.15vw;
    color: rgba(255,255,255,.6); font-variant-numeric: tabular-nums; }
  #right { position: relative; min-width: 0; overflow: hidden;
    -webkit-mask-image: linear-gradient(transparent 0%, #000 16%, #000 84%, transparent 100%);
            mask-image: linear-gradient(transparent 0%, #000 16%, #000 84%, transparent 100%); }
  #lines { position: absolute; left: 0; right: 0; top: 0; padding-top: 13vh; transition: transform .55s cubic-bezier(.32,.72,0,1); }
  .line { font-size: 2.8vw; font-weight: 700; line-height: 1.24; padding: 1.3vh 3.5% 1.3vh 0; color: rgba(255,255,255,.32);
    transition: color .25s ease, transform .3s ease; transform-origin: left center; }
  .line.on { color: #fff; transform: scale(1.03); }
  .line.past { color: rgba(255,255,255,.45); }
  .line.status { color: rgba(255,255,255,.6); }
  .gap { font-size: 2.8vw; letter-spacing: .5vw; }
  #plain { font-size: 2.1vw; line-height: 1.5; color: rgba(255,255,255,.85); white-space: pre-wrap; }
  #msg { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 2.6vw; color: rgba(255,255,255,.75); transition: opacity .6s ease; }
  #msg small { margin-top: 1.5vh; font-size: 1.5vw; color: rgba(255,255,255,.45); }
  .hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="stage" class="hidden">
  <div id="left">
    <div id="art"></div>
    <div id="title"></div>
    <div id="artist"></div>
    <div id="bar"><div id="fill"></div></div>
    <div id="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  </div>
  <div id="right"><div id="lines"></div></div>
</div>
<div id="msg">Now Playing<small>Waiting for your phone…</small></div>
<script>
(function () {
  var NS = "urn:x-cast:net.dgcinema.nowplaying";
  var $ = function (id) { return document.getElementById(id); };
  var st = { title: "", artist: "", playing: false, pos: 0, dur: 0, at: performance.now(), color: 0x202020 };
  var lyr = { key: "", synced: false, lines: [], plain: "" };
  var cur = -2, plainY = 0;

  function fmt(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
  }
  function hex(c) { return "#" + ("000000" + ((c >>> 0) & 0xffffff).toString(16)).slice(-6); }
  function position() { return st.pos + (st.playing ? performance.now() - st.at : 0); }

  function setBg(c) {
    var r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255;
    var dk = "rgb(" + Math.round(r * .35) + "," + Math.round(g * .35) + "," + Math.round(b * .35) + ")";
    $("bg").style.background = "linear-gradient(135deg, " + hex(c) + " 0%, " + dk + " 100%)";
  }

  function onState(m) {
    var changed = m.title !== st.title || m.artist !== st.artist;
    st.title = m.title || ""; st.artist = m.artist || "";
    st.playing = !!m.playing; st.pos = m.pos || 0; st.dur = m.dur || 0; st.at = performance.now();
    if (typeof m.color === "number" && m.color !== st.color) { st.color = m.color; setBg(m.color); }
    $("title").textContent = st.title; $("artist").textContent = st.artist;
    $("dur").textContent = fmt(st.dur);
    $("stage").classList.toggle("hidden", !st.title);
    $("msg").classList.toggle("hidden", !!st.title);
    if (changed) cur = -2;
  }

  function onArt(m) {
    if (!m.data) return;
    var a = $("art");
    a.style.opacity = 0;
    setTimeout(function () { a.style.backgroundImage = "url(data:image/jpeg;base64," + m.data + ")"; a.style.opacity = 1; }, 300);
  }

  function onLyrics(m) {
    lyr.key = m.key || ""; lyr.synced = !!m.synced; lyr.lines = m.lines || []; lyr.plain = m.plain || "";
    var box = $("lines");
    box.innerHTML = "";
    box.style.transform = "translateY(0)";
    cur = -2; plainY = 0;
    if (lyr.synced && lyr.lines.length) {
      lyr.lines.forEach(function (l) {
        var d = document.createElement("div");
        d.className = "line" + (l.s.trim() ? "" : " gap");
        d.textContent = l.s.trim() ? l.s : "• • •";
        box.appendChild(d);
      });
    } else if (lyr.plain) {
      var p = document.createElement("div"); p.id = "plain"; p.textContent = lyr.plain; box.appendChild(p);
    } else {
      var n = document.createElement("div"); n.className = "line status"; n.textContent = m.status || ""; box.appendChild(n);
    }
  }

  function tick() {
    var p = position();
    if (st.dur > 0) {
      $("fill").style.width = Math.min(100, p / st.dur * 100) + "%";
      $("cur").textContent = fmt(Math.min(p, st.dur));
    }
    if (lyr.synced && lyr.lines.length) {
      var i = -1;
      for (var k = 0; k < lyr.lines.length; k++) { if (lyr.lines[k].t <= p) i = k; else break; }
      if (i !== cur) {
        cur = i;
        var els = $("lines").children;
        for (var j = 0; j < els.length; j++) {
          els[j].classList.toggle("on", j === i);
          els[j].classList.toggle("past", j < i);
        }
        var target = els[Math.max(0, i)];
        if (target) {
          var h = $("right").clientHeight;
          var y = target.offsetTop + target.offsetHeight / 2 - h * 0.42;
          $("lines").style.transform = "translateY(" + (-Math.max(0, y)) + "px)";
        }
      }
    } else if (lyr.plain && st.dur > 0) {
      // unsynced lyrics: scroll through them in step with the song so the end isn't cut off
      var box = $("lines"), room = box.offsetHeight - $("right").clientHeight * 0.8;
      var py = Math.round(Math.max(0, room) * Math.max(0, Math.min(1, p / st.dur)));
      if (Math.abs(py - plainY) >= 2) { plainY = py; box.style.transform = "translateY(" + (-py) + "px)"; }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  var ctx = cast.framework.CastReceiverContext.getInstance();
  ctx.addCustomMessageListener(NS, function (ev) {
    var m = ev.data;
    if (typeof m === "string") { try { m = JSON.parse(m); } catch (e) { return; } }
    if (!m || !m.t) return;
    if (m.t === "state") onState(m);
    else if (m.t === "art") onArt(m);
    else if (m.t === "lyrics") onLyrics(m);
  });
  ctx.addEventListener(cast.framework.system.EventType.SENDER_DISCONNECTED, function () {
    if (ctx.getSenders().length === 0) ctx.stop();
  });
  var opts = new cast.framework.CastReceiverOptions();
  opts.disableIdleTimeout = true;          // no video playing: keep the screen up while the phone is connected
  opts.skipPlayersLoad = true;
  opts.customNamespaces = {};
  opts.customNamespaces[NS] = cast.framework.system.MessageType.JSON;
  ctx.start(opts);
  // idle timeout is off, so if no phone ever connects (it lost Wi-Fi or was closed while this page was opening),
  // close after a minute instead of staying on the TV until someone casts something else
  setTimeout(function () { if (ctx.getSenders().length === 0) ctx.stop(); }, 60000);
})();
</script>
</body>
</html>
